name: Container image

# The image is the zero-install quickstart, so it tracks main as well as tags:
# `:main` is the current state of the branch, `:latest` the newest stable tag.
# Pull requests build the same platforms without pushing, so a broken Dockerfile
# fails review instead of after the merge that publishes `:main`.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on this amd64 runner. The build is short enough that
      # the penalty is minor, and the audience skews to Apple Silicon, where an
      # emulated amd64 Node server would be slower still at runtime.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Skipped for pull requests: nothing is pushed, and a fork's read-only
      # token cannot authenticate here anyway.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only published refs seed the shared cache, so a pull request cannot
          # evict what `main` builds from.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

name: Container image

# PRs build and smoke-test both architectures without publishing. Main and tags
# publish the tested platform images, then assemble the multi-platform tags.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Build records are diagnostic artifacts too; keep their storage bounded.
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 1

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Tags do not run CI. Each platform must validate the publishing boundary.
      - name: Validate project version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:check -- "$RELEASE_TAG"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=pr

      # Build natively and run the documented CLI on each architecture before
      # publishing. The digest export below reuses this builder's local layers.
      - name: Build the native image for the CLI smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: inference-lens:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Install dependencies for the smoke test
        run: npm ci

      - name: Run the CLI through the image
        run: npm run test:docker-cli -- inference-lens:smoke

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs never push images or replace the published refs' build caches.
      # Separate cache scopes prevent the two architectures evicting each other.
      - name: Publish the tested platform image by digest
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export the platform digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Keep the existing check name. A failed/cancelled platform fails this gate;
  # public tags move only after both architectures have passed their smoke tests.
  publish:
    name: Build image
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require both native builds
        env:
          BUILDS_RESULT: ${{ needs.build.result }}
        run: test "$BUILDS_RESULT" = success

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        if: github.event_name != 'pull_request'
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=pr

      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Publish the multi-platform tags
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$IMAGE_METADATA")
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

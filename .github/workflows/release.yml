name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Signed macOS bundle
    runs-on: macos-latest
    # Notarization waits on Apple, which is the one step that can stall.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Run independently of the macOS signing policy. Container publishing is a
      # separate workflow, so both publishing paths call the same repository
      # validator and reject malformed or mismatched tags at their own boundary.
      - name: Validate project version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:check -- "$RELEASE_TAG"

      - name: Check macOS release policy
        id: policy
        env:
          MACOS_RELEASE_ENABLED: ${{ vars.MACOS_RELEASE_ENABLED }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "${MACOS_RELEASE_ENABLED:-}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### macOS release skipped"
              echo
              echo "Set the repository variable \`MACOS_RELEASE_ENABLED\` to \`true\`"
              echo "only after Apple signing and notarization secrets are configured."
              echo "No unsigned macOS artifact was built."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret ${name} is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::macOS releases are enabled but signing configuration is incomplete"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: meta
        if: steps.policy.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "Signed and notarized universal macOS build for Apple Silicon and Intel."
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.policy.outputs.enabled == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        if: steps.policy.outputs.enabled == 'true'
        with:
          workspaces: src-tauri

      - run: npm ci
        if: steps.policy.outputs.enabled == 'true'

      # Build only: release creation is deliberately deferred until the signed
      # bundle independently passes the verification step below.
      - name: Build signed and notarized bundle
        if: steps.policy.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin

      - name: Verify signature, Gatekeeper acceptance, and notarization
        id: verify
        if: steps.policy.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$app_path" ] || [ -z "$dmg_path" ]; then
            echo "::error::Expected universal macOS app and DMG were not produced"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          xcrun stapler validate "$dmg_path"

          echo "dmg-path=$dmg_path" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified signed macOS artifact"
            echo
            echo "- Code signature: valid"
            echo "- Gatekeeper assessment: accepted"
            echo "- Notarization staple: valid"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed manual-build artifact
        if: steps.policy.outputs.enabled == 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: inference-lens-macos-universal-signed
          path: ${{ steps.verify.outputs.dmg-path }}
          if-no-files-found: error

      - name: Create draft GitHub release
        if: steps.policy.outputs.enabled == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.meta.outputs.body }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DMG_PATH: ${{ steps.verify.outputs.dmg-path }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/inference-lens-release-notes.md"
          printf '%s\n' "$RELEASE_BODY" > "$notes_file"
          args=(
            release create "$GITHUB_REF_NAME"
            "$DMG_PATH"
            --draft
            --verify-tag
            --title "Inference Lens ${GITHUB_REF_NAME}"
            --notes-file "$notes_file"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

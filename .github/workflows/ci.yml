name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    # A hung test would otherwise run to GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run version:check

      - run: npm run lint

      - run: npm run typecheck:core

      # `npm test` runs `npm run build` first, so the web build is covered here.
      - run: npm test

  e2e-shards:
    name: End-to-end shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # Above playwright.config.ts's globalTimeout, so the suite's own bound
    # fires first and leaves a report rather than the job being cut off.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/playwright-chromium

      # Keep two browser workers per machine; scale across isolated runners.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=2

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The browser checks outside the ordinary suite, in parallel with its shards
  # rather than appended to one of them.
  e2e-lanes:
    name: End-to-end safe regex and Python MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/playwright-chromium

      # AGENTS.md requires every user-visible change to be verified against a
      # running app. Without this job that rule is unenforced, and a browser
      # check can go stale without anything failing.
      - run: npm run test:safe-regex:browser

      # The Node MCP fixture negotiates at most 2025-11-25 and cannot be killed
      # mid-call as a separate process; this lane runs the same host against the
      # official Python SDK, pinned in scripts/requirements-mcp.txt.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install -r scripts/requirements-mcp.txt

      - run: npm run test:e2e -- --config playwright.python-mcp.config.ts

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-lanes
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Preserve the existing check name and require every browser job to succeed.
  e2e:
    name: End-to-end
    needs: [e2e-shards, e2e-lanes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all browser jobs
        env:
          SHARDS_RESULT: ${{ needs.e2e-shards.result }}
          LANES_RESULT: ${{ needs.e2e-lanes.result }}
        run: test "$SHARDS_RESULT" = success && test "$LANES_RESULT" = success

  desktop:
    name: Desktop host
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run check:rust

      - run: npm run test:rust

      # Credential storage is gated behind `cfg(not(debug_assertions))`, so the
      # keychain path only exists in a release build. This is the only place it
      # is compiled and executed.
      - name: Release-mode host tests (keychain path)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

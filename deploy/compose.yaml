# Published-image deployment template. Download this file as `compose.yaml`,
# optionally create a sibling `.env`, then run `docker compose up -d`.
services:
  inference-lens:
    image: ghcr.io/acgabbert/inference-lens:latest
    # Deliberately track the current stable release. Compose checks GHCR at
    # every `up`, but leaves a running container alone when its image is current.
    pull_policy: always
    environment:
      INFERENCE_LENS_API_KEY: ${INFERENCE_LENS_API_KEY:-}
      INFERENCE_LENS_API_ENDPOINT: ${INFERENCE_LENS_API_ENDPOINT:-}
      INFERENCE_LENS_MODEL: ${INFERENCE_LENS_MODEL:-}
      INFERENCE_LENS_API_PROTOCOLS: ${INFERENCE_LENS_API_PROTOCOLS:-}
      INFERENCE_LENS_CONNECTIONS: ${INFERENCE_LENS_CONNECTIONS:-}
      INFERENCE_LENS_ALLOWED_HOSTS: ${INFERENCE_LENS_ALLOWED_HOSTS:-}
      INFERENCE_LENS_N8N_BASE_URL: ${INFERENCE_LENS_N8N_BASE_URL:-}
      INFERENCE_LENS_N8N_API_KEY: ${INFERENCE_LENS_N8N_API_KEY:-}
      INFERENCE_LENS_N8N_LIST_RESPONSE_LIMIT_BYTES: ${INFERENCE_LENS_N8N_LIST_RESPONSE_LIMIT_BYTES:-}
      INFERENCE_LENS_N8N_DETAIL_RESPONSE_LIMIT_BYTES: ${INFERENCE_LENS_N8N_DETAIL_RESPONSE_LIMIT_BYTES:-}
      INFERENCE_LENS_SOURCE_ROOTS: ${INFERENCE_LENS_SOURCE_ROOTS:-}
    # For INFERENCE_LENS_CONNECTIONS, mount the catalog and its key files
    # read-only and set the variable to the in-container path, for example
    # INFERENCE_LENS_CONNECTIONS=/config/connections.json in .env.
    # INFERENCE_LENS_SOURCE_ROOTS works the same way, with each prompt source
    # folder mounted read-only beside it (docs/DOCKER.md).
    # volumes:
    #   - ~/.config/inference-lens:/config:ro
    #   - ~/src/n8n-workflows:/sources/n8n-workflows:ro
    ports:
      - "127.0.0.1:${INFERENCE_LENS_PORT:-3000}:3000"
    # Docker Desktop resolves this on its own. The mapping makes a provider on
    # the host reachable by the same name on plain Linux Docker Engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

services:
  inference-lens:
    build:
      context: .
    env_file:
      - .env
    # For INFERENCE_LENS_CONNECTIONS, mount the catalog and its key files
    # read-only and set the variable in .env to the in-container path, for
    # example INFERENCE_LENS_CONNECTIONS=/config/connections.json.
    # INFERENCE_LENS_SOURCE_ROOTS works the same way, with each prompt source
    # folder mounted read-only beside it (docs/DOCKER.md).
    # volumes:
    #   - ~/.config/inference-lens:/config:ro
    #   - ~/src/n8n-workflows:/sources/n8n-workflows:ro
    ports:
      - "127.0.0.1:${INFERENCE_LENS_PORT:-3000}:3000"
    # Docker Desktop resolves host.docker.internal on its own; plain Linux
    # Docker Engine does not, and a provider running natively on the host is
    # then unreachable by the name the app tells users to try.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

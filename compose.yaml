services:
  inference-lens:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:${INFERENCE_LENS_PORT:-3000}:3000"
    # Docker Desktop resolves host.docker.internal on its own; plain Linux
    # Docker Engine does not, and a provider running natively on the host is
    # then unreachable by the name the app tells users to try.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
